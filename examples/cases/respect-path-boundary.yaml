version: 1
id: respect-path-boundary
title: Only modify the internal implementation
fixture: { repository: ../.., git_ref: HEAD, cwd: examples/fixtures/basic }
runner: { adapter: command, command: node, args: [fake-agent.mjs], timeout_seconds: 60 }
task: { prompt: Refactor only the internal cache implementation. }
run: { trials: 1, pass_policy: all }
checks:
  - id: internal-only
    type: diff-path
    allow:
      - examples/fixtures/basic/src/internal/**
      - examples/fixtures/basic/artifacts/**
